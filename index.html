<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arrlght Mancing Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 32px 20px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Arrlght Mancing</h2>
    <p>Mini App berhasil dimuat.</p>
    <p id="status">Memeriksa lingkungan Telegram...</p>
    <button id="close" hidden>Tutup Mini App</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const status = document.getElementById("status");
    const closeButton = document.getElementById("close");

    if (tg) {
      tg.ready();
      tg.expand();

      status.textContent = tg.initData
        ? "Berjalan di dalam Telegram."
        : "Telegram Web App API tersedia; data inisialisasi belum tersedia.";

      closeButton.hidden = false;
      closeButton.addEventListener("click", () => tg.close());
    } else {
      status.textContent =
        "Halaman terbuka di browser biasa, bukan lingkungan Mini App Telegram.";
    }
  </script>
</body>
</html>
