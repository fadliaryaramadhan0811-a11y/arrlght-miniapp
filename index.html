<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Arrlght Mancing — Verifikasi</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      text-align: center;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }

    .card {
      box-sizing: border-box;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }

    #status {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>Arrlght Mancing</h2>
    <p id="status" role="status" aria-live="polite">
      Menyiapkan proses verifikasi...
    </p>
    <button id="retry" type="button" hidden>Coba Lagi</button>
    <button id="close" type="button" hidden>Tutup Mini App</button>
  </main>

  <script>
    (() => {
      "use strict";

      const API_BASE_URL =
        "https://cove-truly-adapted-cons.trycloudflare.com";

      const tg = window.Telegram?.WebApp;
      const statusElement = document.getElementById("status");
      const retryButton = document.getElementById("retry");
      const closeButton = document.getElementById("close");

      let isProcessing = false;

      if (tg) {
        tg.ready();
        tg.expand();
        closeButton.hidden = false;
      }

      closeButton.addEventListener("click", () => {
        if (tg) tg.close();
        else window.close();
      });

      function getToken() {
        // Parameter resmi Telegram Mini App.
        const telegramToken = tg?.initDataUnsafe?.start_param;

        if (typeof telegramToken === "string" && telegramToken) {
          return telegramToken;
        }

        // Fallback untuk pengujian manual di browser.
        // Jangan gunakan parameter ini untuk membawa URL verifikasi.
        return new URLSearchParams(window.location.search).get("token");
      }

      function showError(message) {
        statusElement.textContent = message;
        retryButton.hidden = false;
        retryButton.disabled = false;
        isProcessing = false;
      }

      async function consumeToken() {
        if (isProcessing) return;

        const token = getToken();

        if (!token || token.length > 256) {
          showError(
            "Token verifikasi tidak ditemukan atau tidak valid. " +
            "Buka Mini App melalui tombol yang disediakan bot."
          );
          return;
        }

        isProcessing = true;
        retryButton.hidden = true;
        retryButton.disabled = true;
        statusElement.textContent = "Memvalidasi token verifikasi...";

        try {
          const response = await fetch(`${API_BASE_URL}/api/consume`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token }),
            cache: "no-store",
            redirect: "error"
          });

          if (!response.ok) {
            throw new Error(
              response.status === 404 || response.status === 410
                ? "Token sudah digunakan atau kedaluwarsa."
                : "Backend tidak dapat memproses token."
            );
          }

          const data = await response.json();

          if (typeof data.url !== "string") {
            throw new Error("Respons backend tidak valid.");
          }

          let destination;

          try {
            destination = new URL(data.url);
          } catch {
            throw new Error("Alamat tujuan tidak valid.");
          }

          if (destination.protocol !== "https:") {
            throw new Error("Alamat tujuan harus menggunakan HTTPS.");
          }

          statusElement.textContent = "Membuka halaman verifikasi...";

          // URL tujuan tidak ditampilkan di layar maupun log.
          window.location.replace(destination.href);
        } catch (error) {
          console.error(
            "[Arrlght Mini App]",
            error instanceof TypeError
              ? "Permintaan backend gagal."
              : "Proses verifikasi gagal."
          );

          showError(
            error instanceof Error
              ? error.message
              : "Terjadi kesalahan. Silakan coba lagi."
          );
        }
      }

      retryButton.addEventListener("click", consumeToken);

      consumeToken();
    })();
  </script>
</body>
</html>
